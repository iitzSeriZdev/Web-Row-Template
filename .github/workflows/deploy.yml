# Build the documentation site and publish it to GitHub Pages at
# https://iitzseridev.github.io/Web-Row-Template/.
#
# Every pull request is built and checked but never deployed. A push to main,
# or a manual run on main, builds, checks and deploys.
#
# One-time repository setup: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push supersedes a queued one, but a
# deployment already running is allowed to finish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (lockfile only)
        run: npm ci

      - name: Build the site and its search index
        run: npm run build

      # Every installer message documented, every page in both languages,
      # every link and anchor resolving, nothing loaded from another origin.
      - name: Check
        run: npm run check

      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
